# Process Logging: Non-Blocking File Output
#
# Non-blocking process logs written to a file. Praxis does not rotate the file;
# use journald, logrotate, or a container log driver for rotation and retention,
# or log to stdout/stderr and let the platform capture it.
#
# Usage:
#   RUST_LOG=info cargo run -p praxis-proxy -- -c examples/configs/observability/process-logging.yaml
#   tail -f /tmp/praxis-process.log

runtime:
  logging:
    output: file
    file_path: /tmp/praxis-process.log
    non_blocking: true
    buffer_size: 8192

listeners:
  - name: default
    address: "127.0.0.1:8080"
    filter_chains: [main]

filter_chains:
  - name: main
    filters:
      - filter: static_response
        status: 200
        body: "ok"
